[project]
name = "hre-server"
version = "0.1.0"
description = "HumanRelationEmurator: MCP server for AI agents and web UI for people"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "jinja2>=3.1",
    "networkx>=3.2",
    "webauthn>=2.5,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hre-mcp = "hre_server.mcp_app:main"
hre-admin = "hre_server.admin:main"
hre-web = "hre_server.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hre_server"]

[tool.setuptools.package-data]
hre_server = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
