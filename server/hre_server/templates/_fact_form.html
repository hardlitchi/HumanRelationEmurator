{# 主張を1件追加するフォーム。fields: 候補のフィールド、relationship_id: 関係への主張なら指定 #}
<form method="post" action="/e/{{ e.id }}/facts" class="stack fact-form">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="back" value="{{ request.url.path }}">
  {% if relationship_id %}<input type="hidden" name="relationship_id" value="{{ relationship_id }}">{% endif %}
  <label>項目
    <select name="field" required>
      <option value="">選んでください</option>
      {% for f in fields %}
      <option value="{{ f.key }}" data-type="{{ f.value_type }}" data-options="{{ (f.enum_options or [])|join('|') }}"
              data-desc="{{ f.description or '' }}">{{ f.label }}{% if f.status == 'proposed' %}（提案中）{% endif %}{% if f.requires_trusted_source %} 🔒{% endif %}</option>
      {% endfor %}
    </select>
  </label>
  <p class="muted small field-desc"></p>
  <label class="v-plain">値 <input name="value" autocomplete="off"></label>
  <label class="v-enum" hidden>値 <select name="value" disabled></select></label>
  <label class="v-entity">参照する人（項目が「人」を指すとき）
    <select name="value_entity">
      <option value=""></option>
      {% for o in others %}<option value="{{ o.id }}">{{ o.display_name }}</option>{% endfor %}
    </select>
  </label>
  <div class="inline">
    <label>根拠
      <select name="epistemic">
        {% for k, label in EPISTEMIC.items() %}<option value="{{ k }}" {% if k == 'observed' %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </label>
    <label>確度 <input name="confidence" type="number" min="0.05" max="1" step="0.05" value="1"></label>
    <label>いつから <input name="valid_from" type="date"></label>
  </div>
  <label>メモ（任意） <input name="note"></label>
  <button>記録</button>
</form>
