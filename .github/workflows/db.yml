name: db

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema and seed
        run: |
          psql -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE hre_test"
          psql -v ON_ERROR_STOP=1 -q -d hre_test -f db/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d hre_test -f db/seed.sql
      - name: Smoke test
        run: psql -v ON_ERROR_STOP=1 -q -d hre_test -f db/tests/smoke.sql
