# 使い方は docs/docker.md。設定は .env（.env.example をコピーして作る）
name: hre

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hre
      POSTGRES_USER: hre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
    volumes:
      - db-data:/var/lib/postgresql/data
      # 初回（ボリュームが空のとき）だけ実行される。hre-admin init-db は不要
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hre -d hre"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp:
    build: .
    image: hre-server:local
    restart: unless-stopped
    command: ["hre-mcp", "--http", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://hre:${POSTGRES_PASSWORD}@db:5432/hre
      HRE_PUBLIC_URL: ${HRE_PUBLIC_URL:-https://${HRE_DOMAIN:?.env に HRE_DOMAIN を設定してください}}
      # ホスト側から localhost:<HRE_PORT> で叩く動作確認も通す
      HRE_ALLOWED_HOSTS: ${HRE_DOMAIN},localhost:*,127.0.0.1:*
    depends_on:
      db:
        condition: service_healthy

  web:
    image: hre-server:local
    restart: unless-stopped
    command: ["hre-web", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: postgresql://hre:${POSTGRES_PASSWORD}@db:5432/hre
      HRE_WEB_SECRET: ${HRE_WEB_SECRET:?.env に HRE_WEB_SECRET を設定してください}
      # 「AI 連携」画面に出す MCP の URL。パスキーの origin にも使う
      HRE_PUBLIC_URL: ${HRE_PUBLIC_URL:-https://${HRE_DOMAIN}}
      # パスキーの RP ID。空なら HRE_PUBLIC_URL のホスト名
      HRE_PASSKEY_RP_ID: ${HRE_PASSKEY_RP_ID:-}
      HRE_ALLOWED_HOSTS: ${HRE_DOMAIN}
      HRE_TIMEZONE: ${HRE_TIMEZONE:-Asia/Tokyo}
      HRE_INSECURE_COOKIES: ${HRE_INSECURE_COOKIES:-0}
      # proxy コンテナからの X-Forwarded-Proto を信じる。web 自体はホストにポートを出していない
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_started   # イメージのビルドを mcp 側に任せる

  # 外に出すのはこの1ポートだけ。/mcp を mcp へ、それ以外を web へ振り分ける（TLS は外部のリバースプロキシで終端）
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - ${HRE_BIND_ADDRESS:-127.0.0.1}:${HRE_PORT:-8080}:8080
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - mcp
      - web

volumes:
  db-data:
